name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Don't race two release runs against each other (e.g. a maintainer pushes v0.6.0
# and v0.6.1 in quick succession). Don't cancel the in-flight one — let it finish
# the publish, then queue the next.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# id-token: write is required for NuGet trusted publishing (OIDC).
# contents: write is required to create the GitHub release.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Wrap the publish step in a protected GitHub Environment so a maintainer must
    # approve the release before it goes to nuget.org. Configure the environment
    # at https://github.com/mhagrelius/FuncyTown/settings/environments — see
    # docs/release.md for setup instructions.
    environment: nuget-publish
    steps:
      # SHA-pinned actions for supply-chain safety. Dependabot bumps the pins.
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FuncyTown.sln

      - name: Build
        run: dotnet build FuncyTown.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FuncyTown.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack FuncyTown.sln --configuration Release --no-build --output artifacts

      - name: Verify symbol packages
        run: |
          set -euo pipefail
          # Only the runtime project (FuncyTown.Abstractions) ships a sibling .snupkg.
          # The meta package (FuncyTown) and analyzer-asset packages
          # (FuncyTown.Generators / FuncyTown.Analyzers) all set IncludeSymbols=false
          # because they have no lib/ output — nuget.org rejects empty symbol packages.
          for pkg in artifacts/FuncyTown.Abstractions.*.nupkg; do
            snupkg="${pkg%.nupkg}.snupkg"
            if [ ! -s "$snupkg" ]; then
              echo "Missing or empty symbol package: $snupkg" >&2
              exit 1
            fi
          done
          for pkg in artifacts/FuncyTown.Generators.*.nupkg \
                     artifacts/FuncyTown.Analyzers.*.nupkg \
                     artifacts/FuncyTown.[0-9]*.nupkg; do
            snupkg="${pkg%.nupkg}.snupkg"
            if [ -e "$snupkg" ]; then
              echo "Unexpected symbol package for non-runtime project: $snupkg" >&2
              exit 1
            fi
          done

      - name: Smoke-test packed packages
        run: bash scripts/pack-and-test.sh

      - name: Login to NuGet (OIDC trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: mhagrelius

      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # FuncyTown.Abstractions is the only project with lib/ output, so its
          # nupkg has a real sibling .snupkg that nuget.org accepts. `dotnet nuget
          # push` auto-uploads the sibling.
          dotnet nuget push artifacts/FuncyTown.Abstractions.*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
          # The meta package and the analyzer-asset packages have no symbols
          # to ship (IncludeBuildOutput=false / IncludeSymbols=false). Pass
          # --no-symbols so the client doesn't try to upload an empty .snupkg
          # — nuget.org rejects empty symbol packages with HTTP 400.
          for pkg in artifacts/FuncyTown.Generators.*.nupkg \
                     artifacts/FuncyTown.Analyzers.*.nupkg \
                     artifacts/FuncyTown.[0-9]*.nupkg; do
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate \
              --no-symbols
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          generate_release_notes: true
